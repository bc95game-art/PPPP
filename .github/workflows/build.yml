name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build PCAPdroid APK with embedded MITM
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download apktool
        run: |
          mkdir -p $HOME/bin
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O $HOME/bin/apktool.jar
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O $HOME/bin/apktool
          chmod +x $HOME/bin/apktool
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Verify apktool
        run: apktool --version

      - name: Install Android API-35 framework into apktool
        run: |
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -1)
          echo "Using framework: $ANDROID_JAR"
          apktool if "$ANDROID_JAR" --tag 1
          echo "Framework installed ✓"

      # ─── Decode AndroidManifest.xml from original APK ────────────────────────
      - name: Download original PCAPdroid APK and decode manifest
        run: |
          echo "Downloading original PCAPdroid v1.9.1 APK..."
          wget -q "https://github.com/emanuele-f/PCAPdroid/releases/download/v1.9.1/PCAPdroid_v1.9.1.apk" \
            -O /tmp/original_pcapdroid.apk
          echo "APK size: $(ls -lh /tmp/original_pcapdroid.apk | awk '{print $5}')"

          echo "Decoding APK with apktool (resources + manifest, no smali)..."
          apktool d /tmp/original_pcapdroid.apk \
            -o /tmp/original_decoded \
            -f \
            --no-debug-info \
            --no-src
          
          echo "=== Decoded manifest (first 30 lines) ==="
          head -30 /tmp/original_decoded/AndroidManifest.xml
          
          echo "Replacing binary manifest with decoded text version..."
          cp /tmp/original_decoded/AndroidManifest.xml ./AndroidManifest.xml
          echo "✓ Manifest replaced successfully"

          echo "Copying unknown/ directory (DebugProbesKt.bin etc.)..."
          if [ -d /tmp/original_decoded/unknown ]; then
            mkdir -p unknown
            cp -r /tmp/original_decoded/unknown/. unknown/
            echo "Copied unknown/: $(ls unknown/ | head -20)"
          else
            echo "No unknown/ dir in decoded APK"
          fi

      # ─── Extract native libs (.so) from original PCAPdroid APK ───────────────
      - name: Extract native libraries from original PCAPdroid APK
        run: |
          echo "Extracting native .so files from original APK..."
          mkdir -p /tmp/pcapdroid_libs
          # APK is a ZIP — extract lib/ directory directly
          cd /tmp/pcapdroid_libs
          unzip -o /tmp/original_pcapdroid.apk "lib/*" 2>/dev/null || true
          cd -

          # Copy .so files for each ABI into our lib/ directory
          for ARCH_DIR in /tmp/pcapdroid_libs/lib/*/; do
            if [ -d "$ARCH_DIR" ]; then
              ARCH=$(basename "$ARCH_DIR")
              mkdir -p "lib/$ARCH"
              cp "$ARCH_DIR"*.so "lib/$ARCH/" 2>/dev/null || true
              echo "✓ Copied $(ls lib/$ARCH/*.so 2>/dev/null | wc -l) .so files for $ARCH"
              ls lib/$ARCH/*.so 2>/dev/null | xargs -I{} basename {}
            fi
          done

          echo ""
          echo "=== Final lib/ native files ==="
          find lib -name "*.so" | sort

      # ─── Patch AndroidManifest.xml: add MitmService ──────────────────────────
      - name: Add MitmService to AndroidManifest.xml
        run: |
          python3 << 'PYEOF'
          SERVICE_DECL = '    <service android:name="com.pcapdroid.mitm.MitmService" android:exported="false" />'

          with open("AndroidManifest.xml", "r", encoding="utf-8") as f:
              xml_str = f.read()

          if "com.pcapdroid.mitm.MitmService" in xml_str:
              print("MitmService already present — skipping patch")
          else:
              if "</application>" not in xml_str:
                  print("ERROR: </application> not found in manifest!")
                  import sys; sys.exit(1)
              xml_str = xml_str.replace("</application>", SERVICE_DECL + "\n</application>", 1)
              print("✓ Added MitmService declaration to manifest")

          with open("AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(xml_str)

          # Verify
          with open("AndroidManifest.xml") as f:
              content = f.read()
          assert "com.pcapdroid.mitm.MitmService" in content, "Patch verification failed!"
          print("✓ Manifest patch verified OK")
          print(f"  Manifest size: {len(content)} chars")
          PYEOF

      # ─── Download & Decompile MITM Addon ─────────────────────────────────────
      - name: Download PCAPdroid-mitm addon APK
        run: |
          RELEASE_URL=$(curl -s https://api.github.com/repos/emanuele-f/PCAPdroid-mitm/releases/tags/v1.4 \
            | python3 -c "
          import sys, json
          rel = json.load(sys.stdin)
          assets = rel.get('assets', [])
          for a in assets:
              print(a['browser_download_url'])
          ")
          echo "Available assets:"
          echo "$RELEASE_URL"

          DL_URL=$(echo "$RELEASE_URL" | grep -i "arm64" | head -1)
          if [ -z "$DL_URL" ]; then
            DL_URL="https://github.com/emanuele-f/PCAPdroid-mitm/releases/download/v1.4/PCAPdroid-mitm_v1.4_arm64-v8a.apk"
          fi
          echo "Downloading: $DL_URL"
          wget -q "$DL_URL" -O /tmp/mitm_addon.apk
          echo "Addon APK size: $(ls -lh /tmp/mitm_addon.apk | awk '{print $5}')"

      - name: Decompile MITM addon with apktool
        run: |
          apktool d /tmp/mitm_addon.apk -o /tmp/mitm_decoded -f --no-debug-info
          echo "=== Smali dirs ==="
          ls /tmp/mitm_decoded/smali* 2>/dev/null || echo "(no smali dirs)"
          echo "=== Lib dirs ==="
          ls /tmp/mitm_decoded/lib/ 2>/dev/null || echo "(no lib dir)"
          echo "=== Assets ==="
          ls /tmp/mitm_decoded/assets/ 2>/dev/null || echo "(no assets)"

      # ─── Merge Addon into Our Project ────────────────────────────────────────
      - name: Merge addon smali (MitmService + Chaquopy)
        run: |
          for SMALI_DIR in /tmp/mitm_decoded/smali /tmp/mitm_decoded/smali_classes2 /tmp/mitm_decoded/smali_classes3; do
            if [ -d "$SMALI_DIR" ]; then
              echo "Merging $SMALI_DIR ..."
              cp -rn "$SMALI_DIR"/. smali/ 2>/dev/null || true
            fi
          done
          echo "=== MitmService smali ==="
          find smali/com/pcapdroid -name "*.smali" 2>/dev/null | head -20 || echo "(not found)"
          echo "=== Chaquopy smali ==="
          find smali/com/chaquo -name "*.smali" 2>/dev/null | wc -l || echo "0"

      # ─── Patch MitmService smali: init AndroidPlatform before Python.getInstance() ─
      - name: Patch MitmService smali — AndroidPlatform init
        run: |
          python3 << 'PYEOF'
          import re, os, sys

          # Find MitmService.smali (merged from addon at build time)
          smali_path = None
          for root, dirs, files in os.walk("smali"):
              for fname in files:
                  if fname == "MitmService.smali":
                      smali_path = os.path.join(root, fname)
                      break
              if smali_path:
                  break

          if not smali_path:
              print("ERROR: MitmService.smali not found after smali merge!")
              sys.exit(1)

          print(f"Found: {smali_path}")
          with open(smali_path, "r") as f:
              content = f.read()

          if "AndroidPlatform" in content:
              print("Already contains AndroidPlatform — skipping patch")
              sys.exit(0)

          # ── Step 1: Find onCreate method and bump .registers by 1
          # In smali: for onCreate(this)V with .registers = R
          #   p0 = v(R-1)  ← 'this' (the Service/Context)
          #   locals = v0 .. v(R-2)
          # After bump to R+1:
          #   p0 = v(R)    ← 'this' (shifted up)
          #   locals = v0 .. v(R-1)   ← v(R-1) is a brand-new free register
          method_match = re.search(
              r'(\.method public onCreate\(\)V\s*\n(\s*\.registers\s+(\d+)\s*\n))',
              content, re.MULTILINE
          )
          if not method_match:
              print("ERROR: '.method public onCreate()V' with .registers not found!")
              # Print what methods exist
              for line in content.split('\n'):
                  if '.method' in line:
                      print(' ', line)
              sys.exit(1)

          old_regs = int(method_match.group(3))
          new_regs = old_regs + 1
          temp_reg = f"v{old_regs - 1}"   # the new free local after bump
          print(f"onCreate .registers: {old_regs} → {new_regs}, temp register: {temp_reg}")

          # Replace just the .registers line inside onCreate
          content = (
              content[:method_match.start(2)]
              + f"    .registers {new_regs}\n"
              + content[method_match.end(2):]
          )

          # ── Step 2: Build the injection snippet
          # Guard with Python.isStarted() so we don't double-init
          PATCH = (
              f"    invoke-static {{}}, Lcom/chaquo/python/Python;->isStarted()Z\n"
              f"    move-result {temp_reg}\n"
              f"    if-nez {temp_reg}, :cond_py_started\n"
              f"    new-instance {temp_reg}, Lcom/chaquo/python/android/AndroidPlatform;\n"
              f"    invoke-direct {{{temp_reg}, p0}}, Lcom/chaquo/python/android/AndroidPlatform;-><init>(Landroid/content/Context;)V\n"
              f"    invoke-static {{{temp_reg}}}, Lcom/chaquo/python/Python;->start(Lcom/chaquo/python/Platform;)V\n"
              f"    :cond_py_started\n"
          )

          # ── Step 3: Find Python.getInstance() call and inject before it
          TARGET = "    invoke-static {}, Lcom/chaquo/python/Python;->getInstance()Lcom/chaquo/python/Python;"
          if TARGET not in content:
              print("ERROR: Could not find Python.getInstance() call in MitmService!")
              print("=== All Python-related lines ===")
              for line in content.split('\n'):
                  if 'Python' in line or 'getInstance' in line:
                      print(' ', repr(line))
              sys.exit(1)

          content = content.replace(TARGET, PATCH + TARGET, 1)
          print(f"✓ Injected AndroidPlatform init (register {temp_reg}) before Python.getInstance()")

          with open(smali_path, "w") as f:
              f.write(content)

          print("✓ MitmService.smali patched successfully")
          print("=== Patched onCreate ===")
          m2 = re.search(r'\.method public onCreate\(\)V.*?\.end method', content, re.DOTALL)
          if m2:
              print(m2.group()[:1200])
          PYEOF

      - name: Copy addon native libraries
        run: |
          for ARCH_DIR in /tmp/mitm_decoded/lib/*/; do
            ARCH=$(basename "$ARCH_DIR")
            mkdir -p "lib/$ARCH"
            cp "$ARCH_DIR"*.so "lib/$ARCH/" 2>/dev/null || true
            echo "Copied $(ls lib/$ARCH/*.so 2>/dev/null | wc -l) .so files for $ARCH"
          done
          echo "=== lib/ contents ==="
          find lib -name "*.so" 2>/dev/null | head -20 || echo "(none)"

      - name: Copy addon assets (Chaquopy Python runtime + mitmproxy)
        run: |
          if [ -d /tmp/mitm_decoded/assets/chaquopy ]; then
            mkdir -p assets/chaquopy
            cp -r /tmp/mitm_decoded/assets/chaquopy/. assets/chaquopy/
            echo "Copied chaquopy assets: $(du -sh assets/chaquopy | awk '{print $1}')"
          fi
          if [ -f /tmp/mitm_decoded/assets/cacert.pem ]; then
            cp /tmp/mitm_decoded/assets/cacert.pem assets/
            echo "Copied cacert.pem"
          fi
          echo "=== assets/ ==="
          ls -la assets/

      # ─── Replace app icon with custom icon ───────────────────────────────────
      - name: Replace app icons with custom icon
        run: |
          # ImageMagick is pre-installed on ubuntu-latest
          SRC="app_icon_source.png"
          echo "Source icon: $(ls -lh $SRC)"

          # Android mipmap icon sizes (density → px)
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
            ["mipmap-television-xhdpi"]=96
          )

          for DIR in "${!SIZES[@]}"; do
            PX="${SIZES[$DIR]}"
            if [ -d "res/$DIR" ]; then
              convert "$SRC" -resize "${PX}x${PX}" "res/$DIR/ic_launcher.png"
              echo "✓ res/$DIR/ic_launcher.png → ${PX}×${PX}"
              # round icon = same image (circular mask applied by Android)
              if [ -f "res/$DIR/ic_launcher_round.png" ]; then
                convert "$SRC" -resize "${PX}x${PX}" "res/$DIR/ic_launcher_round.png"
                echo "  ↳ ic_launcher_round.png updated"
              fi
            fi
          done

          echo "=== Updated icons ==="
          find res -name "ic_launcher*.png" | sort | xargs ls -lh

      # ─── Prepare unknown/ directory ──────────────────────────────────────────
      - name: Populate unknown/ directory (files listed in apktool.yml unknownFiles)
        run: |
          mkdir -p unknown
          # All files listed in apktool.yml unknownFiles must be in unknown/
          # They exist at repo root — copy them to unknown/
          for f in \
            billing.properties \
            firebase-encoders.properties \
            firebase-encoders-json.properties \
            firebase-encoders-proto.properties \
            play-services-base.properties \
            play-services-basement.properties \
            play-services-location.properties \
            play-services-places-placereport.properties \
            play-services-tasks.properties \
            transport-api.properties \
            transport-backend-cct.properties \
            transport-runtime.properties \
            stamp-cert-sha256; do
            if [ -f "$f" ]; then
              cp "$f" "unknown/$f"
              echo "✓ Copied $f → unknown/"
            elif [ -f "original/$f" ]; then
              cp "original/$f" "unknown/$f"
              echo "✓ Copied original/$f → unknown/"
            else
              echo "⚠ Not found: $f"
            fi
          done
          # DebugProbesKt.bin — from decoded original APK or existing unknown/
          if [ ! -f unknown/DebugProbesKt.bin ]; then
            if [ -f /tmp/original_decoded/unknown/DebugProbesKt.bin ]; then
              cp /tmp/original_decoded/unknown/DebugProbesKt.bin unknown/
              echo "✓ Copied DebugProbesKt.bin from decoded APK"
            else
              echo "⚠ DebugProbesKt.bin not found anywhere"
            fi
          fi
          echo "=== unknown/ contents ==="
          ls -la unknown/

      # ─── Comprehensive resource fix (3 issues) ───────────────────────────────
      - name: Fix resources — APKTOOL_DUMMY, duplicate items, missing IDs
        run: |
          python3 << 'PYEOF'
          import os, re, base64

          # ── ISSUE 1: Remove empty APKTOOL_DUMMY <item> entries from drawables.xml
          # The empty <item type="drawable" name="APKTOOL_DUMMY_XX" /> declarations
          # conflict with the PNG files we create below.
          # aapt2 sees TWO definitions of the same resource → "duplicate resource" error.
          drawables_xml = "res/values/drawables.xml"
          if os.path.exists(drawables_xml):
              with open(drawables_xml, "r", encoding="utf-8") as f:
                  content = f.read()
              before = content.count("APKTOOL_DUMMY")
              content = re.sub(
                  r'[ \t]*<item type="drawable" name="APKTOOL_DUMMY_[0-9a-fA-F]+" />[ \t]*\n?',
                  '',
                  content
              )
              after = content.count("APKTOOL_DUMMY")
              with open(drawables_xml, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"✓ Removed {before - after} empty APKTOOL_DUMMY items from drawables.xml")

          # ── ISSUE 2: Create 1×1 transparent PNG for every APKTOOL_DUMMY drawable
          # Without actual files the resource table (resources.arsc) points to
          # non-existent files → FileNotFoundException → crash.
          TRANSPARENT_PNG = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJ"
              "AAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="
          )
          dummy_names = set()
          for root, dirs, files in os.walk("res"):
              for fname in files:
                  if not fname.endswith(".xml"):
                      continue
                  with open(os.path.join(root, fname), "r", encoding="utf-8", errors="ignore") as f:
                      txt = f.read()
                  for m in re.findall(r'APKTOOL_DUMMY_[0-9a-fA-F]+', txt):
                      dummy_names.add(m)

          os.makedirs("res/drawable", exist_ok=True)
          created = 0
          for name in sorted(dummy_names):
              png_path = f"res/drawable/{name}.png"
              xml_path = f"res/drawable/{name}.xml"
              if not os.path.exists(png_path) and not os.path.exists(xml_path):
                  with open(png_path, "wb") as f:
                      f.write(TRANSPARENT_PNG)
                  created += 1
          print(f"✓ Created {created} placeholder PNG files for {len(dummy_names)} APKTOOL_DUMMY drawables")

          # ── ISSUE 3: Add missing IDs to ids.xml
          # public.xml declares bottom/custom/layout as type "id" with specific resource IDs,
          # but ids.xml never declares them → aapt2 cannot resolve @id/bottom etc. → crash.
          ids_xml = "res/values/ids.xml"
          needed_ids = ["bottom", "custom", "layout"]
          if os.path.exists(ids_xml):
              with open(ids_xml, "r", encoding="utf-8") as f:
                  ids_content = f.read()
              added = []
              for id_name in needed_ids:
                  if f'name="{id_name}"' not in ids_content:
                      ids_content = ids_content.replace(
                          "</resources>",
                          f'    <item type="id" name="{id_name}" />\n</resources>'
                      )
                      added.append(id_name)
              if added:
                  with open(ids_xml, "w", encoding="utf-8") as f:
                      f.write(ids_content)
                  print(f"✓ Added missing IDs to ids.xml: {added}")
              else:
                  print("✓ All required IDs already in ids.xml")
          PYEOF

      # ─── Guard: exclude non-ABI dirs from lib/ before apktool build ──────────
      - name: Isolate Android native libs from TypeScript lib packages
        run: |
          # The repo's lib/ contains TypeScript packages (api-client-react, api-spec, etc.).
          # apktool only packages lib/<ABI>/ directories; non-ABI names are ignored.
          # We verify this explicitly and list what will be packaged.
          echo "=== lib/ subdirectories ==="
          ls lib/ 2>/dev/null || echo "(empty)"
          echo ""
          VALID_ABIS="armeabi armeabi-v7a arm64-v8a x86 x86_64 mips mips64"
          echo "=== Valid ABI dirs (will be packaged as native libs) ==="
          for abi in $VALID_ABIS; do
            if [ -d "lib/$abi" ]; then
              echo "  lib/$abi/ → $(ls lib/$abi/*.so 2>/dev/null | wc -l) .so files"
              ls lib/$abi/*.so 2>/dev/null | xargs -I{} basename {}
            fi
          done
          echo ""
          echo "=== Non-ABI dirs (apktool ignores these) ==="
          for d in lib/*/; do
            base=$(basename "$d")
            if ! echo "$VALID_ABIS" | grep -qw "$base"; then
              echo "  (ignored) lib/$base/"
            fi
          done

      # ─── Build ────────────────────────────────────────────────────────────────
      - name: Build APK from smali + resources
        run: |
          mkdir -p output
          apktool b . -o output/PCAPdroid-rebuilt.apk --use-aapt2
          echo "Build done: $(ls -lh output/PCAPdroid-rebuilt.apk)"

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Zipalign APK
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/zipalign \
            -v 4 \
            output/PCAPdroid-rebuilt.apk \
            output/PCAPdroid-aligned.apk

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out output/PCAPdroid-signed.apk \
            output/PCAPdroid-aligned.apk
          echo "Signed APK: $(ls -lh output/PCAPdroid-signed.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCAPdroid-APK
          path: output/PCAPdroid-signed.apk
          retention-days: 30

      - name: Create Release (on push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.1-mitm-embedded
          name: PCAPdroid v1.9.1 — با رمزگشایی HTTPS داخلی
          body: |
            ## PCAPdroid v1.9.1 — MITM Embedded

            این APK شامل رمزگشای HTTPS داخلی است و نیاز به نصب addon جداگانه ندارد.

            ### تغییرات:
            - **MITM addon جاسازی‌شده:** سرویس رمزگشایی TLS مستقیماً درون APK
            - **مشاهده ترافیک HTTPS:** بدون نیاز به `com.pcapdroid.mitm` جداگانه
            - **Python runtime:** Chaquopy + mitmproxy (arm64-v8a)
            - **CA cert:** خودکار برای رمزگشایی TLS

            ### نصب:
            1. APK را نصب کنید
            2. در تنظیمات، **TLS Decryption** را فعال کنید
            3. CA certificate را ایمپورت کنید

            - **روش build:** apktool + addon merge
            - **معماری:** arm64-v8a
          files: output/PCAPdroid-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
